name: CI

# Полный cutover проверяется без внешних сервисов и production-секретов:
# db/schema.sql применяется к одноразовой SQLite БД, затем та же база
# используется production build и smoke test.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Schema, tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: "file:./data/ci.db"
      DATABASE_AUTH_TOKEN: ""
      AUTH_SECRET: "ci-only-secret-used-by-the-test-suite-32ch"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.cjs', '**/*.mjs', '**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check environment and project artifacts
        run: npm run doctor

      - name: Repository security policy audit
        run: npm run security:audit

      - name: Dependency vulnerability audit
        run: npm run security:dependencies

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply and verify the reviewed schema
        run: |
          rm -f data/ci.db data/ci.db-*
          npm run db:migrate
          npm run db:check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test the production server
        run: |
          npm start &
          for attempt in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:3000/api/health > health.json; then break; fi
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          for path in / /shop /blog /sitemap.xml; do
            curl -fsS -o /dev/null "http://127.0.0.1:3000$path"
          done
          echo "Smoke test passed."

  windows-schema:
    name: Windows schema migrations
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./data/ci-windows.db"
      DATABASE_AUTH_TOKEN: ""
      AUTH_SECRET: "ci-only-secret-used-by-the-test-suite-32ch"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply and verify migrations through a Windows file URL
        shell: pwsh
        run: |
          npm run db:migrate
          npm run db:check

      - name: Verify db scripts load .env on Windows
        shell: pwsh
        run: |
          @(
            'DATABASE_URL="file:./data/ci-windows-dotenv.db"'
            'DATABASE_AUTH_TOKEN=""'
            'AUTH_SECRET="ci-only-secret-loaded-from-dotenv-32ch"'
          ) | Set-Content -Path .env -Encoding utf8
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          Remove-Item Env:DATABASE_AUTH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:AUTH_SECRET -ErrorAction SilentlyContinue
          npm run db:migrate
          npm run db:check
          npm run db:promote-admin
